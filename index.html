<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Modern Overlay TikTok Live Studio</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800&display=swap" rel="stylesheet">
    
    <style>
        /* Membuat seluruh kanvas transparan penuh */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: transparent; /* 100% Transparan */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Memaksa konten berada di area bawah */
        }

        /* Wadah teks di bagian bawah layar */
        .text-container {
            margin-bottom: 100px; /* Jarak dari batas bawah layar */
            text-align: center;
            position: relative;
            width: 100%;
            height: 100px; /* Ruang untuk transisi animasi */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Styling teks modern */
        .animated-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.5rem;
            font-style: italic;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            position: absolute;
            opacity: 0;
            
            /* Shadow berlapis: membuat efek outline hitam + glow agar tebaca di semua warna background */
            text-shadow: 
                2px 2px 0px rgba(0,0,0,0.9),
                -2px -2px 0px rgba(0,0,0,0.9),
                2px -2px 0px rgba(0,0,0,0.9),
                -2px 2px 0px rgba(0,0,0,0.9),
                0px 10px 20px rgba(0,0,0,0.6);

            /* Animasi dengan kurva kecepatan yang lebih halus (smooth) */
            animation: modernReveal 20s infinite cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Mengatur urutan kemunculan tiap baris teks (tiap teks aktif ~4 detik) */
        .text-1 { animation-delay: 0s; }
        .text-2 { animation-delay: 4s; }
        .text-3 { animation-delay: 8s; }
        .text-4 { animation-delay: 12s; }
        .text-5 { animation-delay: 16s; }

        /* Keyframes Animasi: Masuk dari bawah (blur) -> Diam & membesar perlahan -> Hilang ke atas */
        @keyframes modernReveal {
            0% { 
                opacity: 0; 
                transform: translateY(30px) scale(0.9); 
                filter: blur(8px);
                letter-spacing: -2px;
            }
            3% { 
                opacity: 1; 
                transform: translateY(0px) scale(1); 
                filter: blur(0px);
                letter-spacing: 2px;
            }
            17% { 
                opacity: 1; 
                transform: translateY(0px) scale(1.03); /* Efek zoom in perlahan */
                filter: blur(0px);
                letter-spacing: 4px; /* Teks sedikit merenggang perlahan */
            }
            20% { 
                opacity: 0; 
                transform: translateY(-30px) scale(1.1); 
                filter: blur(8px);
                letter-spacing: 8px;
            }
            21%, 100% { 
                opacity: 0; /* Tetap tersembunyi sambil menunggu giliran teks lain */
            }
        }
    </style>
</head>
<body>

    <div class="text-container">
        <div class="animated-text text-1">@mayora_gold_fx</div>
        <div class="animated-text text-2">Not financial advice</div>
        <div class="animated-text text-3">Join komunitas gratis</div>
        <div class="animated-text text-4">KLIK LINK BIO</div>
        <div class="animated-text text-5">VVIP GRUP GRATIS</div>
    </div>

</body>
</html>
